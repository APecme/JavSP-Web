<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <script>(function(){var t;try{t=localStorage.getItem('javsp-web.theme')}catch(e){}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var d=document.documentElement;d.dataset.theme=t;d.style.colorScheme=t;})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/javsp-logo.png?v=2">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <title>登录 · JavSP WEB</title>
  <link rel="stylesheet" href="/assets/theme.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/assets/app.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/assets/overrides.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/assets/cinema.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/assets/page-layouts.css?v=__ASSET_VERSION__">
</head>
<body class="auth-shell">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="黑暗模式" title="切换到黑暗模式"><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button class="icon-button palette-toggle auth-palette-toggle" type="button" data-accent-toggle aria-expanded="false" aria-label="自定义主题色" title="自定义主题色"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21a9 9 0 1 1 9-9c0 1.8-1.3 3-3 3h-1.6a2.4 2.4 0 0 0-1.8 4c.5.6.2 2-.6 2H12Z"/><circle cx="7.6" cy="11.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="10.4" cy="7.6" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.8" cy="7.9" r="1.1" fill="currentColor" stroke="none"/><circle cx="16.4" cy="12.3" r="1.1" fill="currentColor" stroke="none"/></svg></button>
  <main class="auth-card auth-console">
    <section class="auth-brand" aria-labelledby="login-title">
      <img class="auth-logo" src="/assets/javsp-logo.png" alt="JavSP">
      <p class="eyebrow">JavSP WEB</p>
      <h1 id="login-title">登录 JavSP WEB</h1>
      <p class="muted">整理影片、查看任务进度和管理刮削设置。</p>
      <ul class="auth-points" aria-label="控制台功能">
        <li><strong>整理影片</strong><span>手动刮削与自动规则共用同一套预设。</span></li>
        <li><strong>查看任务</strong><span>队列、日志、下载和自动化状态集中管理。</span></li>
        <li><strong>配置连接</strong><span>爬虫、媒体服务器和下载器按分组维护。</span></li>
      </ul>
    </section>
    <section class="auth-form-panel" aria-labelledby="auth-form-title">
      <div class="auth-form-head"><p class="page-kicker">控制台</p><h2 id="auth-form-title">进入工作区</h2></div>
      <form id="login-form" class="stack">
        <label>用户名<input id="username" autocomplete="username" required></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">进入控制台</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
      <p class="hint">首次登录的用户名和密码均为 admin。登录后请在系统设置中修改密码。</p>
      <p id="login-version" class="app-version auth-version">读取版本…</p>
    </section>
  </main>
  <script src="/assets/theme.js?v=__ASSET_VERSION__"></script>
  <script src="/assets/icons.js?v=__ASSET_VERSION__"></script>
  <script>
    const normalizeVersion = (value) => String(value || '').replace(/^[vV]+/, '');
    fetch('/api/public-info').then((response) => response.ok ? response.json() : null).then((info) => { if (info && info.version) document.querySelector('#login-version').textContent = `v${normalizeVersion(info.version)}`; }).catch(() => {});
    const form = document.querySelector('#login-form');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      document.querySelector('#login-error').textContent = '';
      try {
        const response = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:document.querySelector('#username').value.trim(), password:document.querySelector('#password').value})});
        if (!response.ok) throw new Error((await response.json()).detail || '登录失败');
        location.href = '/';
      } catch (error) {
        document.querySelector('#login-error').textContent = error.message;
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
