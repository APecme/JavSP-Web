name: Deploy project site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "javsp_web/web/**"
      - "javsp_web/ai.py"
      - "javsp_web/skills/**"
      - "vendor/JavSP/config.yml"
      - "scripts/build_demo.py"
      - "tests/test_demo.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build demo from current application
        run: |
          python -m pip install PyYAML
          python scripts/build_demo.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify demo behavior
        run: node tests/test_demo.cjs
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
