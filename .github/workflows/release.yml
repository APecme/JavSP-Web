name: Publish beta Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also publish the latest Docker tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: apecme/javsp-web

jobs:
  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set beta release label
        id: release
        shell: bash
        run: echo "label=bata.$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=bata
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_latest }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            JAVSP_WEB_RELEASE_LABEL=${{ steps.release.outputs.label }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
