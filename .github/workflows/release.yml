name: Publish beta Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: apecme/javsp-web

jobs:
  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser request and version regressions
        run: node tests/test_web_client.cjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set beta release label
        id: release
        shell: bash
        run: echo "label=bata.$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=bata
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            JAVSP_WEB_RELEASE_LABEL=${{ steps.release.outputs.label }}
          load: true
          tags: javsp-web:verify
      - name: Verify scraping regressions in candidate image
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" javsp-web:verify sh -c "python -m pip install -r tests/requirements.txt && python -m unittest discover -s tests -v"
      - name: Check CA trust and site HTTPS connectivity
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" javsp-web:verify python tests/check_https.py
      - name: Publish verified beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            JAVSP_WEB_RELEASE_LABEL=${{ steps.release.outputs.label }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
