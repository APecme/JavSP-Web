name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  IMAGE_NAME: apecme/javsp-web

jobs:
  docker:
    name: Publish Docker release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            JAVSP_WEB_RELEASE_LABEL=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean JavSPWeb.spec
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          name: JavSP WEB ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v1.1.33.md
          files: dist/JavSP-Web.exe
